<div class="container">
   <div class="reviews">
     <owl-carousel-o [options]="customOptions">

  @for(review of [1,2,3,4]; track review){

    <ng-template carouselSlide>

      <div class="box">

        <div class="name">

          <img [src]="`images/review${review}.jpg`" alt="">

          <h2>
            Ahmed Nouh
            <p>Owner</p>
          </h2>

        </div>

        <p class="text">
          Ab vel consequatur repellat eos omnis accusamus porro sunt dolorem.
        </p>

        <div class="rate">

          @for(star of [1,2,3,4]; track star){

            <i class="fa-solid fa-star star"></i>

          }

          <img src="images/Group.svg" alt="" class="comment">

        </div>

      </div>

    </ng-template>

  }

</owl-carousel-o>

     </div>

    </div>
